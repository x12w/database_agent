<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySQL 智能查询助手</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <ellipse cx="12" cy="6" rx="8" ry="3"/>
        <path d="M4 6v6c0 1.5 3.5 3 8 3s8-1.5 8-3V6"/>
        <path d="M4 12v6c0 1.5 3.5 3 8 3s8-1.5 8-3v-6"/>
      </svg>
      <h1>MySQL <span class="header-subtitle">智能查询助手</span></h1>
    </div>
    <div class="header-right">
      <select id="db-selector" class="db-selector" title="选择数据库" onchange="onDbChange(this.value)">
        <option value="">加载中...</option>
      </select>
      <button id="btn-manage-db" class="btn-ghost" title="管理数据库" onclick="onManageDb()">⚙</button>
      <button id="btn-table-filter" class="btn-filter" title="筛选表" onclick="openTableFilter()">筛选</button>
      <span id="status-indicator" class="status-dot" title="点击刷新连接" onclick="refreshConnection()" style="cursor:pointer;"></span>
      <span id="status-label" class="status-label" title="点击刷新连接" onclick="refreshConnection()" style="cursor:pointer;">就绪</span>
      <button id="btn-new-chat" class="btn-ghost" title="新建会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button id="btn-toggle-panel" class="btn-ghost" title="切换思考面板">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 12h18"/>
        </svg>
      </button>
      <button id="btn-refresh-schema" class="btn-ghost" title="完全重建缓存（删除旧缓存并重新构建）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main content -->
  <main class="main-layout">
    <!-- Chat panel -->
    <section class="chat-panel" id="chat-panel">
      <div class="chat-messages" id="chat-messages">
        <div class="welcome-message">
          <div class="welcome-icon">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1" width="48" height="48">
              <ellipse cx="24" cy="12" rx="16" ry="6"/>
              <path d="M8 12v12c0 3 7 6 16 6s16-3 16-6V12"/>
              <path d="M8 24v12c0 3 7 6 16 6s16-3 16-6V24"/>
            </svg>
          </div>
          <h2>欢迎使用 MySQL 智能查询助手</h2>
          <p>用自然语言提问，我将自动查询数据库并给出回答。</p>
          <div class="welcome-examples">
            <span class="example-label">示例：</span>
            <button class="example-chip" data-query="数据库有哪些表？">数据库有哪些表？</button>
            <button class="example-chip" data-query="有哪些人缺考？">有哪些人缺考？</button>
            <button class="example-chip" data-query="统计各部门人数">统计各部门人数</button>
          </div>
        </div>
      </div>

      <!-- Input area -->
      <div class="chat-input-area">
        <form id="chat-form" class="chat-form">
          <div class="input-wrapper">
            <textarea
              id="message-input"
              placeholder="输入您的问题，例如：有哪些人缺考？"
              rows="1"
              maxlength="4000"
              autocomplete="off"
            ></textarea>
            <button type="submit" id="btn-send" class="btn-send" title="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M22 2L11 13"/>
                <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
            </button>
          </div>
        </form>
        <div class="input-footer">
          <span id="char-count">0 / 4000</span>
          <span class="mode-badge" id="mode-badge">LLM模式</span>
        </div>
      </div>
    </section>

    <!-- Thinking panel -->
    <aside class="thinking-panel" id="thinking-panel">
      <div class="thinking-header">
        <span class="thinking-dot"></span>
        <span>Agent 追踪</span>
      </div>
      <div class="thinking-content" id="thinking-content">
        <div class="thinking-empty">
          <span class="muted">等待查询...</span>
        </div>
      </div>
    </aside>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script src="/static/app.js?v=15"></script>
</body>
</html>
